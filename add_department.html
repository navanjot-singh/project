{% extends 'base.html' %}
{% block title %}Add Department{% endblock %}
{% block page_title %}Add Department{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('departments') }}" style="color:var(--muted);text-decoration:none;">Departments</a> / Add{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;">
  <div class="card-header"><span class="card-title">New Department</span></div>
  <form method="POST">
    <div class="form-grid">
      <div class="form-group full"><label>Department Name</label><input type="text" name="name" placeholder="e.g. Master of Computer Applications" required></div>
      <div class="form-group full"><label>Short Code</label><input type="text" name="code" placeholder="e.g. MCA" required></div>
    </div>
    <div style="display:flex;gap:12px;margin-top:24px;">
      <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Add Department</button>
      <a href="{{ url_for('departments') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
