{% extends 'base.html' %}
{% block title %}Add Subject{% endblock %}
{% block page_title %}Add Subject{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('subjects') }}" style="color:var(--muted);text-decoration:none;">Subjects</a> / Add{% endblock %}
{% block content %}
<div class="card" style="max-width:620px;">
  <div class="card-header"><span class="card-title">New Subject</span></div>
  <form method="POST">
    <div class="form-grid">
      <div class="form-group"><label>Subject Name</label><input type="text" name="name" placeholder="e.g. Data Structures" required></div>
      <div class="form-group"><label>Subject Code</label><input type="text" name="code" placeholder="e.g. MCA101" required></div>
      <div class="form-group">
        <label>Department</label>
        <select name="dept_id" required>
          <option value="">Select Department</option>
          {% for dept in departments %}<option value="{{ dept.id }}">{{ dept.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Semester</label>
        <select name="semester" required>
          {% for s in range(1,7) %}<option value="{{ s }}">Semester {{ s }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group"><label>Credits</label><input type="number" name="credits" value="3" min="1" max="6" required></div>
    </div>
    <div style="display:flex;gap:12px;margin-top:24px;">
      <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Add Subject</button>
      <a href="{{ url_for('subjects') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
