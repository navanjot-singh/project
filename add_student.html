{% extends 'base.html' %}
{% block title %}Add Student{% endblock %}
{% block page_title %}Add Student{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('students') }}" style="color:var(--muted);text-decoration:none;">Students</a> / Add{% endblock %}

{% block content %}
<div class="card" style="max-width:720px;">
  <div class="card-header"><span class="card-title">New Student Registration</span></div>
  <form method="POST">
    <div class="form-grid">
      <div class="form-group">
        <label>Roll Number</label>
        <input type="text" name="roll_no" placeholder="e.g. MCA2024001" required>
      </div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Student full name" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="student@email.com" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" name="phone" placeholder="10-digit number">
      </div>
      <div class="form-group">
        <label>Department</label>
        <select name="dept_id" required>
          <option value="">Select Department</option>
          {% for dept in departments %}
          <option value="{{ dept.id }}">{{ dept.name }} ({{ dept.code }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Semester</label>
        <select name="semester" required>
          {% for s in range(1,7) %}<option value="{{ s }}">Semester {{ s }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Admission Year</label>
        <input type="number" name="year" value="2024" min="2000" max="2030" required>
      </div>
      <div class="form-group">
        <label>Login Password (default: roll no)</label>
        <input type="text" name="password" placeholder="Leave blank to use roll number">
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-top:24px;">
      <button type="submit" class="btn btn-primary"><i class="fas fa-user-plus"></i> Register Student</button>
      <a href="{{ url_for('students') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
